name: build

on:
  workflow_dispatch:
  push:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per variant, run in parallel. A failure in one doesn't hide the
  # other's APK, and neither is gated behind tests.
  build:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            task: assembleRelease
            path: app/build/outputs/apk/release/*.apk
            artifact: apk-release
          - variant: debug
            task: assembleDebug
            path: app/build/outputs/apk/debug/*.apk
            artifact: apk-debug

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Restore the release key when the secrets exist, so signatures stay
      # stable across builds and updates install over each other.
      - name: Restore keystore
        if: matrix.variant == 'release' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Report size
        run: |
          for apk in ${{ matrix.path }}; do
            [ -f "$apk" ] || continue
            echo "**${{ matrix.variant }}**: \`$(basename "$apk")\` — $(du -h "$apk" | cut -f1)" \
              >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
