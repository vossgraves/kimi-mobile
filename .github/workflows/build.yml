name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # APK first and published immediately: a failing screenshot test should
      # never stop you from installing the build.
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run tests
        id: tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      # Gradle's console output truncates test exceptions to one line, so the
      # real cause only exists in the XML reports.
      - name: Print test failures
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::group::Failure details"
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            if grep -q '<failure\|<error' "$f"; then
              echo "----- $(basename "$f") -----"
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse(sys.argv[1])
          for case in tree.iter('testcase'):
              for bad in list(case.iter('failure')) + list(case.iter('error')):
                  print(f"\n### {case.get('classname')}.{case.get('name')}")
                  print((bad.get('message') or '').strip()[:600])
                  print((bad.text or '').strip()[:2000])
          PY
            fi
          done
          echo "::endgroup::"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/**
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      # Surface test status without blocking the APK artifact.
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "APK is published above; tests still need fixing."
          exit 1
