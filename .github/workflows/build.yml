name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Restore the signing key so every build installs over the last one.
      # Without a stable key each APK is a different app to Android and
      # updates fail with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      - name: Restore keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      # One Gradle invocation builds both variants in parallel — two separate
      # runs re-ran configuration and half the compile work twice.
      - name: Build both APKs
        run: ./gradlew assembleDebug assembleRelease --parallel --stacktrace

      - name: Report APK sizes
        run: |
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variant | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for apk in app/build/outputs/apk/*/*.apk; do
            [ -f "$apk" ] || continue
            size=$(du -h "$apk" | cut -f1)
            echo "| $(basename "$apk") | $size |" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$GITHUB_STEP_SUMMARY"

      # Published before tests run: a failing screenshot test must never stop
      # you from having something installable.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run tests
        id: tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      # Gradle truncates test exceptions to one line; the cause is in the XML.
      - name: Print test failures
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::group::Failure details"
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            if grep -q '<failure\|<error' "$f"; then
              echo "----- $(basename "$f") -----"
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse(sys.argv[1])
          for case in tree.iter('testcase'):
              for bad in list(case.iter('failure')) + list(case.iter('error')):
                  print(f"\n### {case.get('classname')}.{case.get('name')}")
                  print((bad.get('message') or '').strip()[:600])
                  print((bad.text or '').strip()[:2000])
          PY
            fi
          done
          echo "::endgroup::"


      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "APKs are published above; tests still need fixing."
          exit 1
