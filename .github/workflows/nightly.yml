name: Nightly

on:
  push:
    branches: [dev]
  workflow_dispatch:

# One nightly at a time; a newer push supersedes an in-flight build.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  nightly:
    name: Build and publish nightly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stamp nightly version
        run: |
          SHA_SHORT="$(git rev-parse --short HEAD)"
          echo "SHA_SHORT=$SHA_SHORT" >> "$GITHUB_ENV"
          echo "Building nightly-$SHA_SHORT"

      # Nightlies ship the minified release build — same size benefits as
      # stable, just built from dev.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Run tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/kimi-mobile-nightly-${SHA_SHORT}.apk"
          ls -lh dist/

      - name: Publish rolling nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (${{ env.SHA_SHORT }})
          body: |
            Automated build from `dev` @ ${{ env.SHA_SHORT }}.

            Nightlies can break. Switch to the Stable channel in
            Settings → Updates if you want tested builds only.
          prerelease: true
          files: dist/*.apk
          # Rolling tag: the in-app updater always reads `nightly`.
          make_latest: false

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-screenshots
          path: app/build/screenshots/**
          if-no-files-found: ignore
