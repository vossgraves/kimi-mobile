name: nightly

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            task: assembleRelease
            path: app/build/outputs/apk/release/*.apk
          - variant: debug
            task: assembleDebug
            path: app/build/outputs/apk/debug/*.apk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        if: matrix.variant == 'release' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          SHA_SHORT="$(git rev-parse --short HEAD)"
          for apk in ${{ matrix.path }}; do
            [ -f "$apk" ] || continue
            cp "$apk" "dist/kimi-mobile-${{ matrix.variant }}-nightly-${SHA_SHORT}.apk"
          done
          ls -lh dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.variant }}
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish rolling nightly
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Collect APKs
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          merge-multiple: true
          path: dist

      - name: Short SHA
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # A rolling `nightly` tag is what the in-app updater reads.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (${{ env.SHA_SHORT }})
          body: |
            Automated build from `dev` @ ${{ env.SHA_SHORT }}.

            Nightlies can break. Switch to Stable in Settings → Updates
            if you want tested builds only.
          prerelease: true
          files: dist/*.apk
          make_latest: false
