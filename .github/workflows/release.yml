name: release

# Stable releases are deliberate: tag a version, or run this by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.0.1'
        required: true

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: release
            task: assembleRelease
            path: app/build/outputs/apk/release/*.apk
          - variant: debug
            task: assembleDebug
            path: app/build/outputs/apk/debug/*.apk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        if: matrix.variant == 'release' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          for apk in ${{ matrix.path }}; do
            [ -f "$apk" ] || continue
            cp "$apk" "dist/kimi-mobile-${VERSION}-${{ matrix.variant }}.apk"
          done
          ls -lh dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: stable-${{ matrix.variant }}
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish stable release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect APKs
        uses: actions/download-artifact@v4
        with:
          pattern: stable-*
          merge-multiple: true
          path: dist

      - name: Compose notes
        id: meta
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Changelog since the previous stable tag.
          PREV="$(git tag -l 'v*' --sort=-creatordate | grep -v "^${VERSION}$" | head -n 1 || true)"
          {
            echo "### Changes"
            if [ -n "$PREV" ]; then
              git log --pretty='- %s' "${PREV}..HEAD" | head -n 60
            else
              git log --pretty='- %s' -n 30
            fi
            echo
            echo "Install \`kimi-mobile-${VERSION}-release.apk\` — the debug build is"
            echo "only useful for troubleshooting."
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          # Stable: not a prerelease, and marked latest so the updater and the
          # repo page both point at it.
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ github.sha }}" \
              --title "Kimi Mobile $VERSION" \
              --notes-file notes.md \
              --latest \
              dist/*.apk
          fi
