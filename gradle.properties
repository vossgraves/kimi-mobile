org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 in a separate process with its own heap — the release build is the long
# pole in CI and this is where its time goes.
android.enableR8.fullMode=true

kotlin.code.style=official
kotlin.incremental=true
# Compile Kotlin in the Gradle daemon rather than spawning a new one per build.
kotlin.compiler.execution.strategy=in-process
